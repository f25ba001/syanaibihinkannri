<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内備品貸出管理アプリ</title>
  <link rel="stylesheet" href="../CSS/kannri.css">
</head>
<body>

  <div class="container">
    <h1>備品貸出管理システム</h1>

    <!-- 1. 貸出登録フォーム -->
    <section class="card">
      <h2>新規貸出登録</h2>
      <form id="rentalForm">
        <div class="form-group">
          <label for="equipmentName">備品名 <span class="required">*</span></label>
          <input type="text" id="equipmentName" placeholder="例: モバイルWi-Fi, プロジェクター" required>
        </div>

        <div class="form-group">
          <label for="borrowerName">借りた人の名前 <span class="required">*</span></label>
          <input type="text" id="borrowerName" placeholder="例: 山田 太郎" required>
        </div>

        <button type="submit" class="btn btn-primary">貸出を登録する</button>
      </form>
    </section>

    <!-- 2. 貸出一覧・返却管理 -->
    <section class="card">
      <h2>貸出状況一覧</h2>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>備品名</th>
              <th>借りた人</th>
              <th>貸出日時</th>
              <th>ステータス</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rentalTableBody">
            <!-- JavaScriptでここにデータが動的に追加されます -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../JavaScript/demo.js"></script>
</body>
</html>
